<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners for standalone display -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle Gridlines / chart aura -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  
  <!-- Outer glowing ring segment -->
  <path d="M 120 256 A 136 136 0 0 1 392 256" fill="none" stroke="url(#blueAccent)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  
  <!-- IPO Upward Trend Graphic -->
  <path d="M 140 340 L 220 260 L 280 300 L 370 170" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Arrow Head -->
  <polygon points="380,150 335,165 365,195" fill="#10b981"/>
  
  <!-- Center Rupee Symbol in a circular badge -->
  <circle cx="256" cy="256" r="54" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
  <!-- Indian Rupee Icon SVG representation -->
  <path d="M 238 232 L 274 232 M 238 244 L 274 244 M 248 244 C 265 244 268 258 258 266 L 244 266 L 268 284" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
